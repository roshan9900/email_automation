version: '3.8'

services:
  email-automation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hdfc_email_automation
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3
      - OLLAMA_TIMEOUT=180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped

